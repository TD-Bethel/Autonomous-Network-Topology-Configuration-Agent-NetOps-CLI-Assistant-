[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "netops-compiler"
version = "0.1.0"
description = "A deterministic, offline-first network intent compiler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.122,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]
batfish = ["pybatfish>=2024.7.0,<2027"]

[project.scripts]
netops = "netops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/netops"]

[tool.hatch.build.targets.wheel.force-include]
"src/netops/templates/ios.j2" = "netops/templates/ios.j2"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["netops"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
